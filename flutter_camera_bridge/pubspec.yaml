name: flutter_camera_bridge
description: Flutter plugin for browsing DSLR images over USB PTP on Android.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_camera_bridge
        pluginClass: FlutterCameraBridgePlugin
